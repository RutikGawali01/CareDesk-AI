name: CareDesk AI CI/CD Pipeline

on:
  push:
    branches: [main, develop, devops-cicd]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ========================================================
  # Stage 1: Frontend Continuous Integration (Lint & Build)
  # ========================================================
  frontend-ci:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Build frontend production bundle
        run: npm run build

  # ========================================================
  # Stage 1: Backend Continuous Integration (Tests & Syntax)
  # ========================================================
  backend-ci:
    name: Backend Test and Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend automated tests
        run: npm test

      - name: Verify backend entry point syntax
        run: node --check src/server.js

  # ========================================================
  # Stage 2 & 3: Build & Publish Backend Image to GHCR
  # ========================================================
  publish-backend:
    name: Build & Publish Backend Image
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/${OWNER,,}/caredesk-backend" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Stage 2 & 3: Build & Publish Frontend Image to GHCR
  # ========================================================
  publish-frontend:
    name: Build & Publish Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/${OWNER,,}/caredesk-frontend" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Stage 4: Automated Deployment Preparation & Verification
  # ========================================================
  deploy:
    name: Deployment Preparation & Verification
    runs-on: ubuntu-latest
    needs: [publish-backend, publish-frontend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devops-cicd') && github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Verify release artifacts and deployment readiness
        run: |
          echo "========================================================="
          echo "CareDesk-AI Automated Deployment Gate"
          echo "========================================================="
          echo "Target Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Backend Image: ghcr.io/${OWNER,,}/caredesk-backend:sha-${GITHUB_SHA::7}"
          echo "Frontend Image: ghcr.io/${OWNER,,}/caredesk-frontend:sha-${GITHUB_SHA::7}"
          echo "========================================================="
          
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] && [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ] && [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "::notice title=Deployment Gated::No external deployment target (DEPLOY_HOST, RENDER_DEPLOY_HOOK, or KUBECONFIG) configured in repository secrets."
            echo "All CI validations, Docker image builds, and container registry publications to GHCR completed successfully."
            echo "Deployment step is safely gated pending infrastructure provisioning in Phase 7."
            exit 0
          fi
          
          echo "External deployment target detected. Executing automated deployment..."
        env:
          OWNER: ${{ github.repository_owner }}
